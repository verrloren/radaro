name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: web/dist is up to date
        run: git diff --exit-code -- web/dist || (echo "::error::web/dist is stale — run 'make web' and commit it" && exit 1)

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o radaro ./cmd/radaro
      - name: smoke test
        run: |
          ./radaro --db /tmp/demo.db demo --serve=false
          ./radaro --db /tmp/demo.db report --json | jq -e '.summary.total == 30'
